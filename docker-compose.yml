services:
  risk-engine:
    build:
      context: .
      dockerfile: apps/risk engine/Dockerfile
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/docs')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3000:3000"
    environment:
      RISK_ENGINE_URL: http://risk-engine:5000
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./apps/api:/app/api
      - ./apps/data:/app/data
      - ./apps/shared:/app/shared
      - api_node_modules:/app/api/node_modules
    command: npm run dev
    depends_on:
      risk-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./apps/dashboard:/app
      - ./apps/shared:/app/shared
      - dashboard_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  dashboard_node_modules:
  api_node_modules:
